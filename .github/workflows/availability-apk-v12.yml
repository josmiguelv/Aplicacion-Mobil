name: Pollos B3 Android V12 availability APK
on:
  push:
    branches: [feat/pollos-b3-v12-delivery-availability-20261119, feat/pollos-b3-v12-order-availability-api-20261120, feat/b3-prepayment-flow-20261120]
    paths:
      - app/build.gradle
      - app/src/main/assets/app.js
      - app/src/main/assets/index.html
      - app/src/main/assets/order-availability.js
      - app/src/main/java/com/integrab2g/pollosb3/MainActivity.java
      - scripts/order-availability-api.test.mjs
      - scripts/order-availability-flow.test.mjs
      - app/src/main/assets/styles.css
      - scripts/checkout-delivery-contract.test.mjs
      - scripts/delivery-availability-v12.test.mjs
      - .github/workflows/availability-apk-v12.yml
  pull_request:
    paths:
      - app/src/main/assets/app.js
      - app/src/main/assets/styles.css
      - scripts/checkout-delivery-contract.test.mjs
      - scripts/delivery-availability-v12.test.mjs
      - .github/workflows/availability-apk-v12.yml
jobs:
  android-v12:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate V12 checkout contracts
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/order-availability.js
          node --test scripts/checkout-delivery-contract.test.mjs scripts/delivery-availability-v12.test.mjs scripts/order-availability-api.test.mjs scripts/order-availability-flow.test.mjs
      - name: Compile Android APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Attach APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pollos-b3-availability-v12-debug
          path: app/build/outputs/apk/debug/app-debug.apk
